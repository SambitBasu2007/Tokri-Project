<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">




    <title>Checkout | Tokri – Compare</title>
    <meta name="description" content="Review your smart cart, split across stores for the best price.">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./checkout.css">
    <link rel="stylesheet" href="./checkout-mode.css">

</head>

<body>

    <header class="checkout-topbar">
        <div class="header-container">
            <a href="../index.html" class="icon-btn" id="checkoutBack" title="Back to cart">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
            <h1 class="checkout-title" id="checkoutmainheader">Checkout</h1>


            <button class="icon-btn community-cart-btn" id="communityCartBtn" title="View community shared cart">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"></path>
                </svg>
                <span class="badge-count" id="sharedCartCount">0</span>
            </button>
        </div>



    </header>

    <main class="checkout-main">









        <div class="section-container checkout-container">
            <section class="checkout-delivery-strip" id="checkoutDeliveryStrip"></section>
            <section class="checkout-card checkout-address-card" id="checkoutAddress"></section>


            <section class="checkout-card" id="communityPickerCard" style="display:none;">
                <h2 class="checkout-card-title">Select a Community</h2>
                <div class="community-picker-strip" id="communityPickerStrip">
                    <div class="community-picker-empty">Loading communities…</div>
                </div>
            </section>

            <section class="checkout-card checkout-order-summary" id="checkoutOrderSummary">
                <h2 class="checkout-card-title">Order Summary</h2>
            </section>
            <section class="checkout-card checkout-bill-details" id="checkoutBillDetails">
                <h2 class="checkout-card-title">Bill Details</h2>
            </section>







            <section class="checkout-card checkout-payment" id="checkoutPayment">
                <h2 class="checkout-card-title">Payment Method</h2>
            </section>


        </div>
    </main>

    <footer class="checkout-action-bar" id="checkoutActionBar">
        <div style="width:100%;">
            <div class="checkout-mode-split" id="checkoutModeSplit">
                <button class="checkout-mode-btn active" id="checkoutIndividualBtn" type="button">🛒 Individual
                    Cart</button>
                <button class="checkout-mode-btn" id="checkoutSharedBtn" type="button">👥 Shared Cart</button>
            </div>
            <div class="checkout-action-total">
                <span class="checkout-action-label">To Pay</span>
                <span class="checkout-action-amount" id="checkoutActionAmount">₹0</span>
            </div>
        </div>
        <button class="btn btn-primary btn-lg" id="placeOrderBtn">Place Order</button>
    </footer>





    <!-- ====================================================================
       SHARED COMMUNITY CART PANEL (checkout page)
       ==================================================================== -->
    <aside class="shared-cart-panel" id="sharedCartPanel">
        <div class="shared-cart-panel-header">
            <h3 class="shared-cart-panel-title">🧺 Community Cart</h3>
            <button class="cart-close-btn" id="sharedCartClose">&times;</button>
        </div>
        <div class="shared-cart-community-select" id="sharedCartCommunitySelect">
            <label>Select Community</label>
            <select id="sharedCartCommunityDropdown">
                <option value="">Loading communities…</option>
            </select>
        </div>
        <div class="shared-cart-panel-body" id="sharedCartBody">
            <div class="cart-empty">
                <span class="cart-empty-icon">🧺</span>
                <p>Select a community to view shared cart</p>
            </div>
        </div>
    </aside>
    <div class="shared-cart-overlay" id="sharedCartOverlay"></div>













    <script src="checkout.js"></script>


    <script type="module" src="../shared/community-cart.js"></script>
    <script type="module" src="./checkout-mode.js"></script>

</body>

</html>
