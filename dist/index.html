    <script>
      // Light is the product default. Only an explicit saved choice may change it.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('tokri_theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch (error) {
          theme = 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
