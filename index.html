<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Follow the OS by default. An explicit toggle is saved and wins next time.
      (function () {
        var theme = 'light';
        try {
          var forced = new URLSearchParams(window.location.search).get('theme');
          var saved = localStorage.getItem('tokri_theme');
          if (forced === 'dark' || forced === 'light') {
            theme = forced;
          } else if (saved === 'dark' || saved === 'light') {
            theme = saved;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (error) {
          theme = 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Tokri compares grocery prices across six Indian quick-commerce stores." />
    <title>Tokri — compare grocery prices</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
